name: Deploy Certificate Verification System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apps/certificate-verification-system

            git pull origin main

            docker build -t certificate-verification-system:latest .

            docker stop certificate-verification-system || true
            docker rm certificate-verification-system || true

            docker run -d \
              --name certificate-verification-system \
              --network host \
              --env-file /opt/apps/certificate-verification-system/.env \
              --restart unless-stopped \
              certificate-verification-system:latest

            docker ps