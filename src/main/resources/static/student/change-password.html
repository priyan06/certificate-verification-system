<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>

<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Change Password</h1>
          <p>Update your account access password securely</p>
        </div>
      </header>

      <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label" for="oldPassword">Current Password *</label>
            <input type="password" id="oldPassword" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">New Password *</label>
            <input type="password" id="newPassword" class="form-control" placeholder="At least 8 characters"
              minlength="8" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password *</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-type new password"
              minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary"
            style="width: 100%; justify-content: center; margin-top: var(--spacing-md);">
            🔑 Update Password Now
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/student/change-password.js"></script>
</body>

</html>
