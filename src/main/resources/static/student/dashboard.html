<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Welcome, <span id="studentWelcomeName" class="text-gradient">Student</span> 👋</h1>
          <p>Access your issued academic certificates and profile records</p>
        </div>
      </header>

      <div class="card" style="margin-bottom: var(--spacing-xl); background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(99,102,241,0.1)); border-color: rgba(168,85,247,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--spacing-md);">
          <div>
            <h3 style="font-size: 1.2rem; margin-bottom: 4px;">Student Account Info</h3>
            <p class="text-secondary" style="font-size: 0.9rem;">
              Register Number: <strong id="studentRegisterNumber" style="color: var(--text-primary);">-</strong> | 
              Program: <strong id="studentCourse" style="color: var(--text-primary);">-</strong>
            </p>
          </div>
          <div>
            <div style="font-size: 2rem; font-weight: 800; color: var(--accent-primary); line-height: 1;" id="totalCertificatesCount">0</div>
            <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary);">Certificates Issued</div>
          </div>
        </div>
      </div>

      <h2 style="font-size: 1.3rem; margin-bottom: var(--spacing-md);">Issued Digital Certificates</h2>
      <div id="certificatesContainer">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/student/dashboard.js"></script>
</body>
</html>
