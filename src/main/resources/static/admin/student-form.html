<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Edit - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1 id="formTitle">Add New Student</h1>
          <p id="formSubtitle">Register official student credentials and profile information</p>
        </div>
        <div class="page-actions">
          <a href="/admin/students.html" class="btn btn-secondary">← Back to Students</a>
        </div>
      </header>

      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <form id="studentForm">
          <!-- Roll Number (Read-only reference shown only during Edit mode) -->
          <div class="form-row" id="rollNumberRow" style="display: none;">
            <div class="form-group">
              <label class="form-label" for="rollNumber">Roll Number</label>
              <input type="text" id="rollNumber" class="form-control" readonly style="opacity: 0.85; background: var(--bg-tertiary);">
              <span class="form-text">System-generated unique identifier (read-only).</span>
            </div>
            <div class="form-group" id="statusGroup">
              <label class="form-label" for="status">Account Status</label>
              <select id="status" class="form-control">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="registerNumber">Register Number *</label>
              <input type="text" id="registerNumber" class="form-control" placeholder="e.g. 21MCA001" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="name">Full Name *</label>
              <input type="text" id="name" class="form-control" placeholder="e.g. Priyan S" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="email">Email Address *</label>
              <input type="email" id="email" class="form-control" placeholder="e.g. priyan@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="mobileNumber">Mobile Number</label>
              <input type="text" id="mobileNumber" class="form-control" placeholder="e.g. 9876543210">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="course">Course / Degree *</label>
              <input type="text" id="course" class="form-control" placeholder="e.g. MCA" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="department">Department *</label>
              <input type="text" id="department" class="form-control" placeholder="e.g. Computer Applications" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="batch">Batch / Academic Period</label>
              <input type="text" id="batch" class="form-control" placeholder="e.g. 2025-2027">
            </div>
            <div class="form-group">
              <label class="form-label" for="dateOfBirth">Date of Birth *</label>
              <input type="date" id="dateOfBirth" class="form-control" required>
            </div>
          </div>

          <!-- Initial Password (shown only on Create Student mode) -->
          <div class="form-row" id="passwordRow">
            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="initialPassword">Initial Password</label>
              <div class="password-input-group">
                <input type="password" id="initialPassword" class="form-control" readonly placeholder="Auto-generated once Name and DOB are entered">
                <button type="button" id="passwordToggleBtn" class="password-toggle-btn" aria-label="Show password" title="Show password">🔒</button>
              </div>
              <span class="form-text">Automatically derived from the first 4 letters of student name and DOB (DDMMYYYY). Encrypted via BCrypt upon submission.</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Address</label>
            <textarea id="address" class="form-control" placeholder="Permanent residence address"></textarea>
          </div>

          <div style="display: flex; gap: var(--spacing-md); justify-content: flex-end; margin-top: var(--spacing-lg);">
            <a href="/admin/students.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" id="submitBtn" class="btn btn-primary">💾 Save Student Profile</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/password-toggle.js"></script>
  <script src="/js/admin/student-form.js"></script>
</body>
</html>
