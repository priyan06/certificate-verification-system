<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Certificates - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Issued Certificates</h1>
          <p>Search, filter, download PDF certificates, verify authenticity, and revoke certificates</p>
        </div>
        <div class="page-actions">
          <a href="/admin/issue-certificate.html" class="btn btn-primary">🎓 Issue Certificate</a>
        </div>
      </header>

      <div class="filter-bar">
        <div class="filter-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Search by student, roll no, cert no, or title...">
        </div>
        <div class="filter-group" style="max-width: 200px;">
          <select id="templateFilter" class="form-control">
            <option value="">All Templates</option>
          </select>
        </div>
        <div class="filter-group" style="max-width: 180px;">
          <select id="statusFilter" class="form-control">
            <option value="">All Statuses</option>
            <option value="ACTIVE">ACTIVE</option>
            <option value="REVOKED">REVOKED</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Certificate No</th>
              <th>Student Name</th>
              <th>Certificate Title</th>
              <th>Issue Date</th>
              <th>Status</th>
              <th>Public Verify</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="certificatesTableBody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
        <div id="paginationContainer"></div>
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/pagination.js"></script>
  <script src="/js/admin/certificates.js"></script>
</body>
</html>
