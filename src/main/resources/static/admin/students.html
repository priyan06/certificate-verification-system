<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Student Directory</h1>
          <p>View, search, add, edit, activate/deactivate students and reset passwords</p>
        </div>
        <div class="page-actions">
          <a href="/admin/student-form.html" class="btn btn-primary">➕ Add Student</a>
        </div>
      </header>

      <div class="filter-bar">
        <div class="filter-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Search by register number, name, or email...">
        </div>
        <div class="filter-group" style="max-width: 200px;">
          <select id="statusFilter" class="form-control" aria-label="Filter by Status">
            <option value="ACTIVE" selected>Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="">All Status</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Register Number</th>
              <th>Student Name</th>
              <th>Course</th>
              <th>Department</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
        <div id="paginationContainer"></div>
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/loader.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/pagination.js"></script>
  <script src="/js/admin/students.js"></script>
</body>
</html>
