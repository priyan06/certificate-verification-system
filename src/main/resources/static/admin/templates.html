<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Templates - Digital Certificate System</title>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Certificate Templates</h1>
          <p>Define certificate printed titles, default descriptions, logo, and authorized signatories</p>
        </div>
        <div class="page-actions">
          <a href="/admin/template-form.html" class="btn btn-primary">➕ Create New Template</a>
        </div>
      </header>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Template Name</th>
              <th>Certificate Printed Title</th>
              <th>Signatories</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="templatesTableBody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/components/modal.js"></script>
