server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: certificate-verification-system

  # Database Configuration (H2 in-memory DB enabled by default with MySQL compatibility mode)
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}



  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  devtools:
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 400ms

  web:
    resources:
      cache:
        period: 0

app:
  base-url: http://localhost:8080
  upload-dir: uploads/certificates

logging:
  level:
    com.example.certificateverification: DEBUG
    org.springframework.security: INFO
